
# Redirect HTTP traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name
        loan.duruj.co
        admininfinity.duruj.co
        appinfinity.duruj.co
        infinitynotify.duruj.co
        wallet-admin.duruj.co
        wallet.duruj.co;

    return 301 https://$host$request_uri;
}

# Loan application - localhost:8180
server {
    listen 443 ssl;
    server_name loan.duruj.com;

    ssl_certificate     /etc/letsencrypt/live/loan.duruj.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/loan.duruj.co/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8180;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

